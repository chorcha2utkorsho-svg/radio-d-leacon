<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Radio Waves Outer -->
  <g transform="translate(256, 235)">
    <!-- Expanding Signal Rings -->
    <circle r="160" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="8 8" opacity="0.25" />
    <circle r="125" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" opacity="0.4" />
    <circle r="95" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.65" />
    
    <!-- Central Glowing Core -->
    <circle r="60" fill="url(#goldGradient)" filter="url(#glow)" opacity="0.9" />
    <circle r="45" fill="#020617" />
    
    <!-- Broadcast Tower / Microphone Antenna Motif -->
    <path d="M-18 -15 L0 -45 L18 -15 Z" fill="url(#goldGradient)" />
    <circle cx="0" cy="-45" r="7" fill="#fde047" />
    <line x1="0" y1="-38" x2="0" y2="28" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />
    <path d="M-16 8 C-16 20 16 20 16 8" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round" />
    <path d="M-22 28 L22 28" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Sound Frequency Bars at bottom -->
  <g transform="translate(146, 385)" fill="url(#goldGradient)">
    <rect x="0" y="-12" width="8" height="24" rx="4" opacity="0.5" />
    <rect x="18" y="-22" width="8" height="44" rx="4" opacity="0.7" />
    <rect x="36" y="-34" width="8" height="68" rx="4" opacity="0.9" />
    <rect x="54" y="-18" width="8" height="36" rx="4" opacity="0.6" />
    <rect x="72" y="-40" width="8" height="80" rx="4" opacity="1" />
    <rect x="90" y="-28" width="8" height="56" rx="4" opacity="0.85" />
    <rect x="108" y="-46" width="8" height="92" rx="4" opacity="1" />
    <rect x="126" y="-30" width="8" height="60" rx="4" opacity="0.85" />
    <rect x="144" y="-40" width="8" height="80" rx="4" opacity="1" />
    <rect x="162" y="-18" width="8" height="36" rx="4" opacity="0.6" />
    <rect x="180" y="-32" width="8" height="64" rx="4" opacity="0.9" />
    <rect x="198" y="-20" width="8" height="40" rx="4" opacity="0.7" />
    <rect x="216" y="-10" width="8" height="20" rx="4" opacity="0.5" />
  </g>

  <!-- Station Brand Typography -->
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="4">
    RADIO D-LEACON
  </text>
  <text x="256" y="492" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f59e0b" letter-spacing="3">
    FM 98.4 · ON AIR
  </text>
</svg>
